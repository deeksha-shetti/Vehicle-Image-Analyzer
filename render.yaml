services:
  # ----------------------------------------------------
  # Unified Single Free Web Service (Frontend + API + Worker)
  # ----------------------------------------------------
  - type: web
    name: vehicle-image-analyzer
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: QUEUE_NAME
        value: image-processing
      - key: WORKER_CONCURRENCY
        value: 2
      - key: MONGODB_URI
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: ik52488h
      - key: CLOUDINARY_API_KEY
        value: 634912983178655
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_VISION_API_KEY
        value: AIzaSyC1xlvAqphUiov5QPSbavex1l4UVMLRMQc
